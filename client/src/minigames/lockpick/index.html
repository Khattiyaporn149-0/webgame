<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lockpick</title>
  <style>
    html,body{height:100%;margin:0;background:linear-gradient(135deg, #1a0033 0%, #0d1b2a 100%);color:#fff;font-family:'Segoe UI',Tahoma,sans-serif}
    .wrap{display:grid;place-items:center;height:100%;}
    .card{width:min(92vw,480px);background:rgba(20,27,45,.95);border:3px solid #444;border-radius:20px;box-shadow:0 12px 50px rgba(0,0,0,.8);padding:32px;text-align:center}
    .head{font-size:28px;font-weight:700;margin-bottom:16px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
    .timer{font-size:32px;color:#ffcc00;font-weight:800;margin-bottom:24px;text-shadow:0 0 15px rgba(255,204,0,.9)}
    .bar{height:48px;background:#1a1a2e;border:4px solid #444;border-radius:30px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.7), inset 0 2px 10px rgba(0,0,0,.6);margin-bottom:32px;position:relative}
    .fill{height:100%;width:0;background:linear-gradient(90deg, #00ff88 0%, #00d9ff 50%, #00aa66 100%);transition:width .1s linear;box-shadow:0 0 20px rgba(0,255,136,.8);position:relative}
    .fill::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg, rgba(255,255,255,.35) 0%, transparent 100%);animation:shimmer 1.5s infinite}
    @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
    .actions{display:flex;gap:14px;justify-content:center}
    button{background:linear-gradient(135deg,#6a11cb,#2575fc);color:#fff;border:none;border-radius:14px;padding:16px 40px;cursor:pointer;font-size:20px;font-weight:700;box-shadow:0 6px 22px rgba(37,117,252,.65);transition:all .2s ease}
    button:hover{background:linear-gradient(135deg,#7b1fcf,#3585fd);box-shadow:0 8px 28px rgba(37,117,252,.85);transform:scale(1.05)}
    button:active{transform:scale(.97)}
    button:disabled{background:#555;cursor:not-allowed;box-shadow:none;opacity:.55}
    button#btnCancel{background:linear-gradient(135deg,#555,#777);box-shadow:0 4px 15px rgba(0,0,0,.5)}
    button#btnCancel:hover{background:linear-gradient(135deg,#666,#888)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="head">🔓 กำลัง Lockpick... <span id="diffLabel" style="opacity:.75;font-size:.7em"></span></div>
      <div class="timer">⏳ <span id="timer">0</span>s</div>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="actions">
        <button id="btnHold">คลิกเพื่อเริ่ม</button>
        <button id="btnCancel">ยกเลิก</button>
      </div>
    </div>
  </div>
  <script src="../mg-bridge.js"></script>
  <script>
    // Parse params
    const usp = new URLSearchParams(location.search);
    const difficulty = usp.get('difficulty') || 'easy';
    const totalTime = parseInt(usp.get('time'),10) || (difficulty==='hard'?45:30);
    document.getElementById('diffLabel').textContent = difficulty==='hard'?'(ยาก)':'(ง่าย)';

    const fill = document.getElementById('fill');
    const timerEl = document.getElementById('timer');

    let startedAt = performance.now();
    let progress = 0; // 0..1
    let clickedOnce = false;

    // Wire single click
    const btnHold = document.getElementById('btnHold');
    btnHold.addEventListener('click', ()=>{
      if (!clickedOnce) {
        clickedOnce = true;
        btnHold.disabled = true;
        btnHold.textContent = 'กำลัง Lockpick...';
        startedAt = performance.now(); // Reset timer when clicked
      }
    });

    // Main loop
    function tick(){
      const now = performance.now();
      
      // Auto-fill progress after click
      if (clickedOnce){
        const elapsed = (now - startedAt) / 1000; // seconds elapsed since click
        progress = Math.min(1, elapsed / totalTime); // 0..1 over totalTime seconds
        fill.style.width = (progress * 100).toFixed(1) + '%';
        
        // Show countdown from totalTime to 0
        const remaining = Math.max(0, Math.ceil(totalTime - elapsed));
        timerEl.textContent = remaining;
        
        if (progress >= 1){
          window.parent.postMessage({ type:'mg:complete' }, '*');
          return; // done
        }
      } else {
        // Before clicking, show total time
        timerEl.textContent = totalTime;
      }

      requestAnimationFrame(tick);
    }

    document.getElementById('btnCancel').addEventListener('click', ()=> window.parent.postMessage({ type:'mg:cancel' }, '*'));

    // Start
    window.parent.postMessage({ type:'mg:ready' }, '*');
    requestAnimationFrame(tick);
  </script>
</body>
</html>
